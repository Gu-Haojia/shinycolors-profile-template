name: Shiny Refresh

on:
  schedule:
    - cron: "17 16 * * *" # UTC 16:17 / 北京时间次日 00:17，避开整点高峰
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - projects.json
      - build.py
      - requirements.txt
      - 'assets/game/**'
      - 'assets/fonts/**'
      - 'assets/illustrations/**'
      - data/icons.json
      - 'tests/**'
      - .github/workflows/shiny-refresh.yml

permissions:
  contents: write

concurrency:
  group: shiny-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Verify built-in token on the template
        if: github.repository == 'Gu-Haojia/shinycolors-profile-template'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import build
          cfg = build.resolve_identity(build.load_config())
          stats = build.fetch(cfg["github"], os.environ["GITHUB_TOKEN"], cfg.get("timezone_offset", 8))
          assert stats["langs_source"] == "graphql"
          assert "days" in stats and "commits" in stats and "contrib_year" in stats
          print("Live GitHub data works with the built-in token; no personal cache was written.")
          PY
      - name: Build profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "Gu-Haojia/shinycolors-profile-template" ]; then
            # 上游模板展示虚构数据；从模板创建的仓库自动使用自己的账号。
            python build.py --demo --readme-mode preserve
          else
            python build.py --strict-refresh
          fi
      - name: Publish generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shinycolors.svg README.md PROFILE.md
          if [ -f data/stats.json ]; then git add data/stats.json; fi
          if git diff --staged --quiet; then
            echo "No generated changes."
          else
            git commit -m "✦ refresh shiny profile"
            git push
          fi
